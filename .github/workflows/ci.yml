name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Compile check (CLI + dashboard)
        run: uv run python -m compileall -q cli.py app.py hivemind demo_tools

      - name: Tests (offline; browser test self-skips without Chromium)
        run: uv run pytest -q
